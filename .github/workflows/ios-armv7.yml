          patch -p1 --no-backup-if-mismatch < /tmp/ov/mod.patch
          mkdir -p src/port/ios tools
          cp -r /tmp/ov/ios_src/. src/port/ios/
          cp -r /tmp/ov/tools/ios tools/
          cp /tmp/ov/Makefile.ios .
          ls src/port/ios Makefile.ios

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 python3-pip python3-venv \
            python3-pil curl ca-certificates zip unzip xz-utils bzip2 git libpng-dev libsqlite3-dev \
            libcurl4-openssl-dev libtinyxml2-dev nlohmann-json3-dev libyaml-cpp-dev libspdlog-dev libzip-dev

      - name: Fetch your ROM from Google Drive
        env:
          ROM_FILE_ID: ${{ inputs.rom_file_id || secrets.DRIVE_ROM_ID }}
        run: |
          set -euo pipefail
          [ -n "${ROM_FILE_ID:-}" ] || { echo "::error::ROM id missing (input rom_file_id or secret DRIVE_ROM_ID)"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q gdown
          "$RUNNER_TEMP/venv/bin/gdown" "$ROM_FILE_ID" -O baserom.us.z64
          ls -la baserom.us.z64

      - name: Extract assets (host tools, extract_assets.py, torch)
        run: |
          set -euo pipefail
          make -C tools mio0 n64graphics displaylist_packer n64cksum tkmk00 extract_data_for_mio
          python3 extract_assets.py us
          cmake -S tools/torch -B tools/torch/cmake-build-release -G Ninja \
                -DCMAKE_PROJECT_INCLUDE="$PWD/tools/psp/torch_fmt_fix.cmake"
          cmake --build tools/torch/cmake-build-release
          tools/torch/cmake-build-release/torch code   baserom.us.z64
          tools/torch/cmake-build-release/torch header baserom.us.z64

      - name: Install Theos + iOS toolchain
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain/linux/iphone"
          curl -fsSL "https://github.com/L1ghtmann/llvm-project/releases/download/main-update_3-eabca92/iOSToolchain-x86_64.tar.xz" -o /tmp/ios-toolchain.tar.xz
          tar -xf /tmp/ios-toolchain.tar.xz -C "$THEOS/toolchain"

      - name: Install iPhoneOS 9.3 SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          git clone --depth 1 https://github.com/Sn0wCooder/theos-sdks.git /tmp/theos-sdks
          tar -xjf /tmp/theos-sdks/iPhoneOS9.3.sdk.tbz2 -C "$THEOS/sdks"

      - name: Build
        run: |
          set -euo pipefail
          make -f Makefile.ios -j"$(nproc)" 2>&1 | tee build-ios.log
          ls -la build/ios/MK64.ipa

      - name: Verify Mach-O
        run: |
          set -euo pipefail
          BIN=build/ios/MK64
          "$THEOS/toolchain/linux/iphone/bin/otool" -hv -l "$BIN" | grep -E "cputype|ARM|vmaddr|flags" | head -12
          # non-PIE at 0x09000000: the game tells real pointers from segmented addresses by value
          "$THEOS/toolchain/linux/iphone/bin/otool" -l "$BIN" | grep -A3 "segname __TEXT" | grep -q "0x09000000"

      - uses: actions/upload-artifact@v4
        with:
          name: MK64-armv7-iOS9
          path: build/ios/MK64.ipa
          if-no-files-found: error
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-ios.log
          if-no-files-found: ignore
