name: Build iOS (armv7, iOS 7-9.3.5)

# GitHub -> Actions -> "Build iOS (armv7, iOS 7-9.3.5)" -> Run workflow.
# Needs YOUR Mario Kart 64 (USA) ROM, fetched from Google Drive ("Anyone with the link"):
# paste the file id below or save it once as the repo secret DRIVE_ROM_ID.
# The IPA links ROM-derived data into the executable: keep it private, never publish it.
# This single file is enough: it carries the whole iOS port and applies it over a checkout
# of the PSP port repo.
# (This file must live at <repo root>/.github/workflows/ on the default branch.)

on:
  workflow_dispatch:
    inputs:
      rom_file_id:
        description: "Drive file ID of baserom.us.z64. Empty = secret DRIVE_ROM_ID"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build-ios-armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply iOS port overlay (embedded in this file)
        run: |
          set -euo pipefail
          mkdir -p /tmp/ov
